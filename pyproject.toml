[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdk9-cli"
version = "0.3.0"
description = "GDk9 CLI — symbolic energy analysis, implication engine, and DCG tools"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["gdk9", "energy", "symbolic", "cli", "dcg", "implication", "numerology"]
authors = [{ name = "Adam Grange", email = "adamgrange@proton.me" }]
license = { text = "AGPL-3.0-or-later" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Environment :: Console",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
]

[project.scripts]
gdk9 = "gdk9.cli:main"
gdk9-saturate = "gdk9.saturate:main"

[project.optional-dependencies]
egglog = ["egglog>=13.0.0"]
dev = ["pytest", "ruff", "black", "pyflakes"]

[tool.setuptools]
packages = { find = { where = ["."] } }

[tool.setuptools.package-data]
gdk9 = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"
